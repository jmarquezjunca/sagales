<script>
const $=s=>document.querySelector(s);

function dist(a,b,c,d){const R=6371000,r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)*r/2),y=(c-a)*r;return Math.hypot(x,y)*R}

 if(k<D.valido389)return"NA";if(w==0||w==6||h)return null;

function header(){let h="";
 if(tab==1){const t=today(),tm=addD(t,1),k=ymd(day),T=tableFor(line,day,dir),two=tablesFor(line,day).length>1;
  const en=d=>{const X=tableFor(line,day,d);return X?ends(X):["",""]},lb=d=>(MN[en(d)[0]]||"")+" → "+(MN[en(d)[1]]||""),dirs=[0,1].sort((x,y)=>(en(x)[0]=="S"?0:1)-(en(y)[0]=="S"?0:1));
  const cols=T?visCols(T,day):[],txt=T?DT[line=="360"?"360":"389"][T.day]+(T.day=="N"?(lect(day)?" · lectivo":" · no lectivo"):""):"";
  h=`<div class="top"><h1>Horarios</h1>${clock(T?txt:dtl(day))}</div>
  <div class="card ctl"><label class="fld"><input type="date" id="dp" value="${iso(day)}"></label><button class="btn ${k==ymd(t)?"on":""}" data-d="0">Hoy</button><button class="btn ${k==ymd(tm)?"on":""}" data-d="1">Mañana</button></div>
  <div class="seg">${LINES.map(l=>`<button class="${l==line?"on":""}" data-l="${l}">${l}</button>`).join("")}</div>`+
  (T?`<div class="seg">${two?dirs.map(d=>`<button class="${d==T.dir?"on":""}" data-dir="${d}">${lb(d)}</button>`).join(""):`<button class="on">${en(T.dir)[0]==en(T.dir)[1]?"Circuito escolar en "+MN[en(T.dir)[0]]:lb(T.dir)}</button>`}</div>`:"")}
 else h=`<div class="top"><h1>Cerca de mí</h1>${clock()}</div>
  <div class="card ctl"><div class="loc">${AIM}<span>${pos?"Ubicación activa"+(acc?" · ±"+acc+" m":""):esc(gpsMsg||"Buscando tu ubicación…")}</span></div><button class="btn dk" id="gps">${pos?"Actualizar":"Reintentar"}</button></div>
  <div class="seg"><button data-tw="M" class="${town=="M"?"on":""}">Estoy en Mollet</button><button data-tw="S" class="${town=="S"?"on":""}">Estoy en Sant Fost</button></div>`;
 $("#hd").innerHTML=h}
function renderH(){const T=tableFor(line,day,dir),m=$("#m"),k=ymd(day);
 if(!T){const n=nextService(line,day),why=dayKey(line,day)=="NA"?"Los horarios de la línea 389 son válidos desde el 7/9/2026.":k>D.finDatos?"El calendario de festivos está cargado hasta el 31/12/2027.":`La línea ${line} no circula ${line=="389.3"||line=="389.4"?"en días no lectivos ni festivos":"sábados, domingos ni festivos"}.`;
  m.innerHTML=`<div class="card msg">${why}${n&&dayKey(line,day)!="NA"?` Próximo servicio: ${lab(n)}.<br><button data-dd="${ymd(n)}">Ver ${lab(n)}</button>`:""}</div>`;return}
 const cols=visCols(T,day),b=near(T),isT=k==ymd(today());let nx=-1,bt=1e9;
 if(b&&isT){const need=nowMin()+Math.ceil(b.d/80);cols.forEach((c,j)=>{const t=c.t[b.i];if(t>=need&&t<bt){bt=t;nx=j}})}

 let h="";
 let pm=null;
 h+=`<div class="tw card"><table><tr><th class="n">PARADA</th>${cols.map((c,j)=>`<th class="${j==nx?"nx":""}">${mixed?`<span class="badge" style="background:${COL[c.l]||"#555"}">${c.l}</span>`:j+1}</th>`).join("")}</tr>`+
 T.r.map((r,i)=>{const mn=ST[r[0]][3]||"",dv=mn!=pm?`<tr class="dv"><td colspan="${cols.length+1}"><span>${esc(mn.toUpperCase())}</span></td></tr>`:"";pm=mn;const f=FAV.has(r[0])?"fav":"";
  return dv+`<tr class="${i%2?"z":""}"><td class="n ${f} ${b&&b.i==i?"me":""}"><div>${esc(r[1])}${r[0]=="4724"?" (a demanda)":""}</div></td>${cols.map((c,j)=>{const v=c.t[i];return`<td class="${j==nx?"nx":""} ${v<0?"e":""} ${f}">${v<0?"—":fmt(v)}</td>`}).join("")}</tr>`}).join("")+`</table></div>`;
 m.innerHTML=h;focusCols(m)}
function focusCols(m){if(!m.querySelector)return;const tw=m.querySelector(".tw");if(!tw)return;const c=tw.querySelector("td.nx"),me=tw.querySelector("td.n.me");
 if(c)tw.scrollLeft=Math.max(0,c.offsetLeft-112-c.offsetWidth);if(me&&(me.offsetTop+me.offsetHeight>tw.scrollTop+tw.clientHeight||me.offsetTop<tw.scrollTop+24))tw.scrollTop=Math.max(0,me.offsetTop-3*30)}
function options(tw){const other=tw=="S"?"M":"S",t0=today(),best=new Map();
 for(let k=0;k<=7;k++){const dt=addD(t0,k);
  for(const l of LINES)for(const T of tablesFor(l,dt))for(const c of visCols(T,dt))for(let i=0;i<T.r.length;i++){const t=c.t[i],s=ST[T.r[i][0]];if(t<0||s[2]!=tw)continue;
   const dd=dist(pos[0],pos[1],s[0],s[1]),need=k?0:nowMin()+Math.ceil(dd/80);if(t<need)continue;
   let j=-1;for(let q=i+1;q<T.r.length;q++)if(c.t[q]>=0&&ST[T.r[q][0]][2]==other){j=q;break}if(j<0)continue;
   const key=T.r[i][1].toLowerCase().replace(/[^a-z0-9]/g,""),o=best.get(key);if(!o||k<o.k||(k==o.k&&t<o.dep))best.set(key,{k,dt,T,c,i,j,dep:t,arr:c.t[j],d:dd,l:c.l})}}

 if(!pos){m.innerHTML=`<div class="card msg">${esc(gpsMsg||"Buscando tu ubicación…")}</div>`;return}

 if(!res.length)h+=`<div class="card msg">No hay buses hacia ${to} en los próximos 7 días.</div>`;
 for(const r of res){const w=r.k?lab(r.dt):`en ${r.dep-nm} min`,all=r.T.r.map((x,q)=>({n:x[1],t:r.c.t[q],q})).filter(x=>x.t>=0),s=ST[r.T.r[r.i][0]];
  h+=`<div class="card sc"><div class="sh"><b>${esc(r.T.r[r.i][1])}</b><span>${s[3]} · ${Math.round(r.d)} m · ${Math.max(1,Math.round(r.d/80))} min a pie</span></div>
  <div class="bus"><div class="bd" style="background:${COL[r.l]||"#555"}">${r.l}</div><div class="bt"><b>Hacia ${to}</b><span>${w} · llega ${fmt(r.arr)}</span></div><div class="tm">${fmt(r.dep)}</div></div>
  <details><summary>Paradas del trayecto (${all.length})</summary>${all.map(x=>`<div class="st" style="${x.q<r.i?"opacity:.5;":""}${x.q==r.i||x.q==r.j?"font-weight:700;color:var(--n)":""}"><span>${esc(x.n)}${x.q==r.i?" ← subes aquí":x.q==r.j?" ← llegas a "+to:""}</span><b>${fmt(x.t)}</b></div>`).join("")}</details></div>`}
 m.innerHTML=h;drawMap(res,nm)}
function drawMap(res,nm){if(typeof L=="undefined"||!$("#mp"))return;

 const pts=[pos];L.circle(pos,{radius:60,weight:0,fillColor:"#1D6FEB",fillOpacity:.18}).addTo(map);L.circleMarker(pos,{radius:8,color:"#fff",weight:3,fillColor:"#1D6FEB",fillOpacity:1}).addTo(map);
 for(const r of res){const s=ST[r.T.r[r.i][0]],p=[s[0],s[1]];pts.push(p);L.circleMarker(p,{radius:5,color:"#fff",weight:2,fillColor:COL[r.l]||"#555",fillOpacity:1}).addTo(map);
  L.marker(p,{interactive:false,icon:L.divIcon({className:"",iconSize:[0,0],html:`<div class="pin" style="background:${COL[r.l]||"#555"}">${r.l} · ${r.k?fmt(r.dep):(r.dep-nm)+"'"}</div>`})}).addTo(map)}
 map.fitBounds(pts,{padding:[34,34],maxZoom:17});setTimeout(()=>map&&map.invalidateSize(),0)}
function render(){if(map){map.remove();map=null}$("#t1").className=tab==1?"on":"";$("#t2").className=tab==2?"on":"";header();tab==1?renderH():renderN()}
function locate(){gpsMsg="";if(!navigator.geolocation){gpsMsg="Este navegador no permite usar la ubicación.";return render()}
