<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Horarios Sagalés · Sant Fost ⇄ Mollet</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B5D7A">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sagalés"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--t:#0B5D7A;--i:#12212B;--g:#4A5B66;--l:#E1E7EC;--a:#F2A900}
*{box-sizing:border-box}html,body{height:100%}
body{position:fixed;inset:0;margin:0;background:#F4F6F8;color:var(--i);font:14px system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}
header{flex:none;background:var(--t);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 8px 10px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto}
.chip{flex:none;height:36px;padding:0 11px;border-radius:18px;border:2px solid rgba(255,255,255,.7);background:none;color:#fff;font-weight:700}
.chip.on{background:#fff;color:var(--t);border-color:#fff}
.seg{display:flex;gap:6px}.seg>*{flex:1;height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 4px;min-width:0}
.seg .on{background:#fff;color:var(--t)}.seg input{border:0;background:none;color:inherit;font-weight:600;width:100%;font-size:13px;color-scheme:light}
.info{display:flex;align-items:center;gap:8px;min-height:30px;font-size:12px}
.info button{height:30px;border-radius:15px;border:2px solid #fff;background:none;color:#fff;font-weight:700;padding:0 10px;font-size:13px;flex:none}
.info span{opacity:.95;line-height:1.2}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.bar{flex:none;background:#fff;border-bottom:1px solid var(--l);padding:4px 10px;font-size:12px;color:var(--g);display:flex;gap:6px;align-items:center;min-height:26px}
.bar b{color:var(--i)}.bar button{margin-left:auto;border:1px solid var(--t);background:#fff;color:var(--t);border-radius:12px;padding:2px 10px}
.tw{flex:1;min-height:0;overflow:auto;background:#fff;scroll-snap-type:x proximity;scroll-padding-left:118px}td:not(.n),th:not(.n){scroll-snap-align:start}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
td,th{height:30px;border-bottom:1px solid var(--l);border-left:1px solid #D3DBE1;padding:0;text-align:center;font-size:12px;font-weight:600;min-width:42px;max-width:42px}
td.n,th.n{position:sticky;left:0;z-index:1;background:#fff;text-align:left;font-weight:600;font-size:11.5px;line-height:1.1;min-width:118px;max-width:118px;padding:0 4px 0 8px;border-left:0;border-right:1px solid var(--l)}
td.n div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
th{position:sticky;top:0;z-index:2;background:#F4F6F8;height:20px;font-size:10px}th.n{z-index:3;background:#F4F6F8}
td.fav{background:#FFF1C2}td.n.fav{background:#FFF1C2;box-shadow:inset 4px 0 0 var(--a)}
td.n.me{box-shadow:inset 4px 0 0 #1565C0}td.n.me div{font-weight:800}
td.nx{background:var(--a)}th.nx{background:var(--a)}td.e{color:#8A99A3;font-weight:400}
.badge{display:inline-block;color:#fff;border-radius:6px;padding:1px 4px;font-size:10px}
.msg{padding:18px 16px;color:var(--g);line-height:1.4}.msg button{margin-top:8px;height:40px;border-radius:20px;border:0;background:var(--t);color:#fff;font-weight:700;padding:0 16px}
.card{flex:none;background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px 12px;margin:8px 12px 0}
.row{display:flex;gap:10px;align-items:center}.row>div{flex:1;min-width:0}.b{color:#fff;border-radius:8px;padding:5px 8px;font-weight:700;flex:none!important}
.big{font-size:18px;font-weight:700}.ac{color:var(--t);font-weight:600}.g{color:var(--g);font-size:12px}
details{margin-top:6px}summary{cursor:pointer;color:var(--t);font-weight:600;font-size:12px}
.st{display:flex;justify-content:space-between;font-size:12px;line-height:1.6}
#mp{flex:none;height:230px;background:#DCE8EE;border-bottom:1px solid var(--l)}
.pin{position:absolute;transform:translate(-50%,-135%);color:#fff;border:2px solid #fff;border-radius:13px;padding:3px 9px;font:700 12px system-ui,sans-serif;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--l);padding-bottom:calc(env(safe-area-inset-bottom)*.5)}
nav button{flex:1;height:42px;border:0;background:#fff;color:var(--g);font-weight:500}nav .on{color:var(--t);font-weight:700}
.foot{flex:none;padding:8px 12px;font-size:11px;color:var(--g);background:#fff}
</style></head><body>
<header id="hd"></header>
<main id="m"></main>
<nav><button id="t1">Horarios</button><button id="t2">Cerca de mí</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="datos.js"></script>
<script>
const $=s=>document.querySelector(s);
const LINES=["360","389.1","389.2","389.3","389.4"],COL={"360":"#B4491B","389":"#5A6B75","389.1":"#0B5D7A","389.2":"#2F7D32","389.3":"#8A5A00","389.4":"#9B2C5A"},MN={S:"Sant Fost",M:"Mollet"};
const DT={"360":{L:"Laborables (excepto agosto)",S:"Sábados y laborables de agosto",F:"Domingos y festivos"},"389":{N:"Laborables (excepto julio y agosto)",JA:"Laborables de julio y agosto",LEC:"Laborables lectivos"}};
let D,ST,HOL,FAV,line="360",dir=0,dirManual=false,day,tab=1,pos=null,town=null,townManual=false,gpsMsg="",map=null;
const pad=n=>String(n).padStart(2,"0"),fmt=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const ymd=d=>""+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const lab=d=>d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"}),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function dist(a,b,c,d){const R=6371000,r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)*r/2),y=(c-a)*r;return Math.hypot(x,y)*R}
function lect(dt){const k=ymd(dt),w=dt.getDay();return w>0&&w<6&&!HOL.has(k)&&k>=D.curso[0]&&k<=D.curso[1]&&!D.vacas.some(v=>k>=v[0]&&k<=v[1])}
function dayKey(l,dt){const k=ymd(dt),w=dt.getDay(),h=HOL.has(k),m=dt.getMonth();
 if(l=="360")return(w==0||h)?"F":(w==6||m==7)?"S":"L";
 if(k<D.valido389)return"NA";if(w==0||w==6||h)return null;
 if(l=="389.3"||l=="389.4")return lect(dt)?"LEC":null;return(m==6||m==7)?"JA":"N"}
const tablesFor=(l,dt)=>{const k=dayKey(l,dt);return k&&k!="NA"?D.tables.filter(t=>t.line==l&&t.day==k):[]};
const tableFor=(l,dt,dr)=>{const a=tablesFor(l,dt);return a.find(t=>t.dir==dr)||a[0]||null};
const visCols=(T,dt)=>T.day=="N"?T.c.filter(c=>!c.s||(c.s=="L")==lect(dt)):T.c;
const ends=T=>{const m=T.r.map(r=>ST[r[0]][2]).filter(x=>x!="O");return[m[0],m[m.length-1]]};
function centroid(m){const s=Object.values(ST).filter(x=>x[2]==m&&x[0]!=null);return[s.reduce((a,x)=>a+x[0],0)/s.length,s.reduce((a,x)=>a+x[1],0)/s.length]}
function pickDir(l,dt){const a=tableFor(l,dt,0),b=tableFor(l,dt,1);if(!a||!b||a===b||!town)return dir;return ends(a)[0]==town?0:ends(b)[0]==town?1:dir}
function nextService(l,from){for(let i=1;i<=30;i++){const x=addD(from,i);if(tableFor(l,x,0))return x}return null}
function near(T){if(!pos)return null;let b=null;T.r.forEach((r,i)=>{const s=ST[r[0]];if(!s||s[0]==null||r[0]=="4724")return;const d=dist(pos[0],pos[1],s[0],s[1]);if(!b||d<b.d)b={i,d,c:r[0],n:r[1]}});return b}
function header(){let h="";
 if(tab==1){const t=today(),tm=addD(t,1),k=ymd(day),T=tableFor(line,day,dir),cols=T?visCols(T,day):[],e=T?ends(T):[];
  const two=T&&tablesFor(line,day).length>1,txt=T?(DT[line=="360"?"360":"389"][T.day]+(T.day=="N"?(lect(day)?" · lectivo":" · no lectivo"):"")+" · "+cols.length+" salidas"):"";
  h=`<div class="chips">${LINES.map(l=>`<button class="chip ${l==line?"on":""}" data-l="${l}">${l}</button>`).join("")}</div>
  <div class="seg"><button data-d="0" class="${k==ymd(t)?"on":""}">Hoy</button><button data-d="1" class="${k==ymd(tm)?"on":""}">Mañana</button><label class="${k!=ymd(t)&&k!=ymd(tm)?"on":""}"><input type="date" id="dp" value="${iso(day)}"></label></div>
  <div class="info">${T?(two?`<button id="sw">${MN[e[0]]||""} → ${MN[e[1]]||""} ⇄</button>`:`<b>${e[0]==e[1]?"Circuito escolar en "+MN[e[0]]:MN[e[0]]+" → "+MN[e[1]]}</b>`):""}<span>${txt}</span></div>`}
 else h=`<div class="chips"><b style="font-size:17px;padding:4px 4px 2px">Cerca de mí</b></div><div class="seg"><button data-tw="M" class="${town=="M"?"on":""}">Estoy en Mollet</button><button data-tw="S" class="${town=="S"?"on":""}">Estoy en Sant Fost</button></div>`;
 $("#hd").innerHTML=h}
function renderH(){const T=tableFor(line,day,dir),m=$("#m"),k=ymd(day);
 if(!T){const n=nextService(line,day),w=day.getDay(),why=dayKey(line,day)=="NA"?"Los horarios de la línea 389 son válidos desde el 7/9/2026.":k>D.finDatos?"El calendario de festivos está cargado hasta el 31/12/2027.":`La línea ${line} no circula ${line=="389.3"||line=="389.4"?"en días no lectivos ni festivos":"sábados, domingos ni festivos"}.`;
  m.innerHTML=`<div class="msg">${why}${n&&dayKey(line,day)!="NA"?` Próximo servicio: ${lab(n)}.<br><button data-dd="${ymd(n)}">Ver ${lab(n)}</button>`:""}</div>`;return}
 const cols=visCols(T,day),b=near(T),isT=k==ymd(today());let nx=-1,bt=1e9;
 if(b&&isT){const need=nowMin()+Math.ceil(b.d/80);cols.forEach((c,j)=>{const t=c.t[b.i];if(t>=need&&t<bt){bt=t;nx=j}})}
 const mixed=new Set(cols.map(c=>c.l)).size>1;
 let h=pos?(b?`<div class="bar"><span>● <b>${esc(b.n)}</b> · ${Math.round(b.d)} m · ${Math.max(1,Math.round(b.d/80))} min${isT?(nx>=0?` · <b>sale ${fmt(bt)}</b>`:" · sin más salidas hoy"):""}</span></div>`:""):(gpsMsg?`<div class="bar"><span>${esc(gpsMsg)}</span><button id="gps">Reintentar</button></div>`:"");
 h+=`<div class="tw"><table>${mixed?`<tr><th class="n">PARADA</th>${cols.map((c,j)=>`<th class="${j==nx?"nx":""}"><span class="badge" style="background:${COL[c.l]||"#555"}">${c.l}</span></th>`).join("")}</tr>`:""}`+
 T.r.map((r,i)=>{const f=FAV.has(r[0])?"fav":"";return`<tr><td class="n ${f} ${b&&b.i==i?"me":""}"><div>${esc(r[1])}${r[0]=="4724"?" (a demanda)":""}</div></td>${cols.map((c,j)=>{const v=c.t[i];return`<td class="${j==nx?"nx":""} ${v<0?"e":""} ${f}">${v<0?"—":fmt(v)}</td>`}).join("")}</tr>`}).join("")+`</table></div>`;
 m.innerHTML=h;focusCols(m)}
function focusCols(m){if(!m.querySelector)return;const tw=m.querySelector(".tw");if(!tw)return;const c=tw.querySelector("td.nx"),me=tw.querySelector("td.n.me");
 if(c)tw.scrollLeft=Math.max(0,c.offsetLeft-118-c.offsetWidth);if(me&&(me.offsetTop+me.offsetHeight>tw.scrollTop+tw.clientHeight||me.offsetTop<tw.scrollTop+24))tw.scrollTop=Math.max(0,me.offsetTop-3*30)}
function options(tw){const other=tw=="S"?"M":"S",t0=today(),best=new Map();
 for(let k=0;k<=7;k++){const dt=addD(t0,k);
  for(const l of LINES)for(const T of tablesFor(l,dt))for(const c of visCols(T,dt))for(let i=0;i<T.r.length;i++){const t=c.t[i],s=ST[T.r[i][0]];if(t<0||s[2]!=tw)continue;
   const dd=dist(pos[0],pos[1],s[0],s[1]),need=k?0:nowMin()+Math.ceil(dd/80);if(t<need)continue;
   let j=-1;for(let q=i+1;q<T.r.length;q++)if(c.t[q]>=0&&ST[T.r[q][0]][2]==other){j=q;break}if(j<0)continue;
   const key=T.r[i][1].toLowerCase().replace(/[^a-z0-9]/g,""),o=best.get(key);if(!o||k<o.k||(k==o.k&&t<o.dep))best.set(key,{k,dt,T,c,i,j,dep:t,arr:c.t[j],d:dd,l:c.l})}}
 const seen=new Set(),out=[];for(const x of[...best.values()].sort((a,b)=>a.d-b.d)){if(seen.has(x.c))continue;seen.add(x.c);out.push(x);if(out.length==4)break}
 return out.sort((a,b)=>a.k-b.k||a.dep-b.dep||a.d-b.d)}
function renderN(){const m=$("#m");
 if(!pos){m.innerHTML=`<div class="msg">${esc(gpsMsg||"Buscando tu ubicación…")}<br><button id="gps">Reintentar</button></div>`;return}
 const res=options(town),to=town=="S"?"Mollet":"Sant Fost",nm=nowMin();
 let h=`<div id="mp"></div><div class="msg" style="padding:8px 12px 0;font-size:12px">PRIMEROS BUSES HACIA ${to.toUpperCase()}</div>`;
 if(!res.length)h+=`<div class="msg">No hay buses hacia ${to} en los próximos 7 días.</div>`;
 for(const r of res){const all=r.T.r.map((x,q)=>({n:x[1],t:r.c.t[q],q})).filter(x=>x.t>=0),w=r.k?`${lab(r.dt)} ${fmt(r.dep)}`:`en ${r.dep-nm} min`;
  h+=`<div class="card"><div class="row"><span class="b" style="background:${COL[r.l]||"#555"}">${r.l}</span><div><b>${esc(r.T.r[r.i][1])}</b><div class="g">${Math.round(r.d)} m · ${Math.max(1,Math.round(r.d/80))} min a pie</div></div><div style="text-align:right"><div class="big">${fmt(r.dep)}</div><div class="ac">${w}</div></div></div>
  <div class="g" style="margin-top:6px">Llega a ${esc(r.T.r[r.j][1])} a las ${fmt(r.arr)}</div><details><summary>Ver todas las paradas (${all.length})</summary>${all.map(x=>`<div class="st" style="${x.q<r.i?"opacity:.5;":""}${x.q==r.i||x.q==r.j?"font-weight:700;color:var(--t)":""}"><span>${esc(x.n)}${x.q==r.i?" ← subes aquí":x.q==r.j?" ← llegas a "+to:""}</span><b>${fmt(x.t)}</b></div>`).join("")}</details></div>`}
 m.innerHTML=h+`<div style="height:10px;flex:none"></div>`;drawMap(res,nm)}
function drawMap(res,nm){if(typeof L=="undefined"||!$("#mp"))return;
 map=L.map("mp");L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 const pts=[pos];L.circle(pos,{radius:60,weight:0,fillColor:"#0B5D7A",fillOpacity:.2}).addTo(map);L.circleMarker(pos,{radius:8,color:"#fff",weight:3,fillColor:"#0B5D7A",fillOpacity:1}).addTo(map);
 for(const r of res){const s=ST[r.T.r[r.i][0]],p=[s[0],s[1]];pts.push(p);L.circleMarker(p,{radius:5,color:"#fff",weight:2,fillColor:COL[r.l]||"#555",fillOpacity:1}).addTo(map);
  L.marker(p,{interactive:false,icon:L.divIcon({className:"",iconSize:[0,0],html:`<div class="pin" style="background:${COL[r.l]||"#555"}">${r.l} · ${r.k?fmt(r.dep):(r.dep-nm)+"'"}</div>`})}).addTo(map)}
 map.fitBounds(pts,{padding:[40,40],maxZoom:17});setTimeout(()=>map&&map.invalidateSize(),0)}
function render(){if(map){map.remove();map=null}$("#t1").className=tab==1?"on":"";$("#t2").className=tab==2?"on":"";header();tab==1?renderH():renderN()}
function locate(){gpsMsg="";if(!navigator.geolocation){gpsMsg="Este navegador no permite usar la ubicación.";return render()}
 navigator.geolocation.getCurrentPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];gpsMsg="";if(!townManual){const a=dist(pos[0],pos[1],...centroid("M")),b=dist(pos[0],pos[1],...centroid("S"));town=a<b?"M":"S"}if(!dirManual)dir=pickDir(line,day);render()},
  e=>{gpsMsg=e&&e.code==1?"Ubicación bloqueada: actívala en el navegador (candado de la barra de direcciones).":"No se pudo obtener la ubicación.";render()},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
document.addEventListener("click",e=>{const c=e.target.closest("[data-l],[data-d],[data-dd],[data-tw],#sw,#gps,#t1,#t2");if(!c)return;
 if(c.dataset.l){line=c.dataset.l;dirManual=false;dir=pickDir(line,day)}else if(c.dataset.d!=null)day=addD(today(),+c.dataset.d);else if(c.dataset.dd){const s=c.dataset.dd;day=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6))}
 else if(c.dataset.tw){town=c.dataset.tw;townManual=true}else if(c.id=="sw"){dir=1-dir;dirManual=true}else if(c.id=="t1")tab=1;else if(c.id=="t2"){tab=2;if(!pos)gpsMsg=""}else if(c.id=="gps")return locate();
 render()});
document.addEventListener("change",e=>{if(e.target.id=="dp"&&e.target.value){const[y,m,d]=e.target.value.split("-");day=new Date(+y,m-1,+d);if(!dirManual)dir=pickDir(line,day);render()}});
function init(){if(!window.DATOS){$("#m").innerHTML='<div class="msg">No se pudieron cargar los horarios (falta datos.js).</div>';return}
 D=DATOS;ST=D.stops;HOL=new Set(D.festivos);FAV=new Set(D.fav);day=today();
 if(!tablesFor(line,day).length)line=LINES.find(l=>tablesFor(l,day).length)||line;render();locate()}
if(document.getElementById("m"))init();
if(/debug/.test(location.search)){const d=document.createElement("div"),pr=document.createElement("div");d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99;background:#ffd;color:#000;font:11px monospace;padding:2px 4px;white-space:pre-wrap";
 pr.style.cssText="position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";document.body.append(d,pr);
 const u=()=>{const s=getComputedStyle(pr);d.textContent=`inner ${innerWidth}x${innerHeight} vv ${window.visualViewport?Math.round(visualViewport.height):"-"} screen ${screen.width}x${screen.height} standalone ${navigator.standalone} safe top ${s.paddingTop} bottom ${s.paddingBottom} body ${Math.round(document.body.getBoundingClientRect().height)}`};u();addEventListener("resize",u);setInterval(u,2000)}
</script></body></html>
